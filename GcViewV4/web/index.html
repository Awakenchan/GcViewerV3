<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GcView</title>
<style>
    :root {
        --v-accent: #c7c7c7;
        --v-accent-hover: #e5e5e5;
        --v-accent-soft: rgba(255, 255, 255, 0.09);
        --v-bg: #111111;
        --v-surface: #171717;
        --v-raised: #242424;
        --v-hover: #292929;
        --v-contrast: #141416;
        --v-border: #262626;
        --v-border-strong: #363636;
        --v-border-subtle: rgba(255, 255, 255, 0.06);
        --v-text: #cccccc;
        --v-text-2: #a3a3a3;
        --v-text-muted: #737373;
        --v-success: #10b981;
        --v-warning: #eab308;
        --v-error: #ef4444;
        --v-info: #3b82f6;
        --v-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
        --v-mono: "JetBrains Mono", "SF Mono", "Cascadia Code", ui-monospace, Consolas, monospace;
        --v-sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", system-ui, sans-serif;
        --tk-kw: #c586c0;
        --tk-var: #9cdcfe;
        --tk-fn: #dcdcaa;
        --tk-str: #ce9178;
        --tk-com: #5e6878;
        --tk-cl: #569cd6;
        --tk-num: #b5cea8;
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        height: 100%;
        background: var(--v-bg);
        color: var(--v-text);
        font-family: var(--v-sans);
        font-size: 13px;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
    }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
        background: #3a3a3a;
        border-radius: 8px;
        border: 2px solid transparent;
        background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover { background: #4a4a4a; background-clip: content-box; }
    ::-webkit-scrollbar-corner { background: transparent; }
    * { scrollbar-width: thin; scrollbar-color: #3a3a3a transparent; }

    button, input { font-family: inherit; }

    .vwin {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--v-surface);
        overflow: hidden;
    }

    .vwin-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 32px;
        flex: 0 0 auto;
        padding-left: 12px;
        background: var(--v-surface);
        border-bottom: 1px solid var(--v-border-subtle);
        -webkit-user-select: none;
        user-select: none;
    }
    .vwin-bar .logo { width: 20px; height: 20px; color: var(--v-text); flex: 0 0 auto; }
    .vwin-title { font-size: 12px; color: var(--v-text); opacity: 0.78; }
    .vwin-right { margin-left: auto; display: flex; align-items: center; gap: 8px; padding-right: 12px; }

    .vwin-inst {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: 22px;
        padding: 0 10px;
        border-radius: 5px;
        border: 1px solid var(--v-border);
        background: var(--v-raised);
        font-size: 11.5px;
        color: var(--v-text-2);
        white-space: nowrap;
        max-width: 280px;
    }
    .vwin-inst .st { overflow: hidden; text-overflow: ellipsis; }
    .dt { width: 7px; height: 7px; border-radius: 999px; background: var(--v-text-muted); flex: 0 0 auto; }
    .dt.on { background: var(--v-success); }
    .dt.wait { background: var(--v-warning); animation: blink 1.4s ease-in-out infinite; }
    .dt.err { background: var(--v-error); }
    .dt.demo { background: var(--v-info); }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

    .demobtn {
        height: 22px;
        padding: 0 9px;
        border-radius: 5px;
        border: 1px solid var(--v-border);
        background: var(--v-raised);
        color: var(--v-text-2);
        font-size: 11.5px;
        cursor: pointer;
    }
    .demobtn:hover { background: var(--v-hover); color: var(--v-text); }
    .demobtn.on { border-color: rgba(59, 130, 246, 0.5); color: #93c5fd; background: rgba(59, 130, 246, 0.12); }

    .urlbox {
        display: flex;
        align-items: center;
        height: 22px;
        border-radius: 5px;
        border: 1px solid var(--v-border);
        background: var(--v-raised);
        padding-left: 8px;
        overflow: hidden;
    }
    .urlbox input {
        width: 168px;
        background: none;
        border: none;
        outline: none;
        color: var(--v-text-2);
        font-family: var(--v-mono);
        font-size: 11px;
    }
    .urlbox input:focus { color: var(--v-text); }
    .urlbox button {
        height: 22px;
        border: none;
        border-left: 1px solid var(--v-border);
        background: transparent;
        color: var(--v-text-2);
        font-size: 11.5px;
        font-weight: 500;
        padding: 0 10px;
        cursor: pointer;
    }
    .urlbox button:hover { background: var(--v-hover); color: var(--v-text); }
    .urlbox button.live { color: var(--v-text); }

    .vwin-body { flex: 1 1 auto; display: flex; min-height: 0; }

    .ide-side {
        width: 262px;
        flex: 0 0 auto;
        background: var(--v-surface);
        border-right: 1px solid var(--v-border-subtle);
        display: flex;
        flex-direction: column;
        min-height: 0;
    }

    .ide-act { display: flex; align-items: center; gap: 2px; padding: 6px 8px; flex: 0 0 auto; }
    .ide-act .ab {
        display: flex; align-items: center; justify-content: center;
        width: 28px; height: 28px;
        border-radius: 5px;
        border: none;
        background: transparent;
        color: var(--v-text-2);
        cursor: pointer;
        position: relative;
    }
    .ide-act .ab svg { width: 16px; height: 16px; }
    .ide-act .ab:hover { color: var(--v-text); background: var(--v-accent-soft); }
    .ide-act .ab.active { color: var(--v-text); background: var(--v-hover); }
    .ide-act .ab .n { position: absolute; top: 2px; right: 1px; width: 6px; height: 6px; border-radius: 999px; background: var(--v-text-muted); }
    .ide-act .ab.active .n { background: var(--v-accent); }

    .ide-search { padding: 8px; flex: 0 0 auto; border-bottom: 1px solid var(--v-border-subtle); }
    .ide-search .box { position: relative; display: flex; align-items: center; }
    .ide-search .box svg { position: absolute; left: 10px; width: 14px; height: 14px; color: var(--v-text-2); pointer-events: none; }
    .ide-search input {
        width: 100%;
        height: 30px;
        border-radius: 6px;
        border: 1px solid var(--v-border);
        background: var(--v-raised);
        padding: 0 10px 0 31px;
        font-size: 12px;
        color: var(--v-text);
        outline: none;
    }
    .ide-search input::placeholder { color: var(--v-text-muted); }
    .ide-search input:focus { border-color: var(--v-border-strong); }

    .ide-types { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 8px 6px; flex: 0 0 auto; }
    .ide-types:empty { display: none; }
    .ide-types .ty {
        height: 21px;
        padding: 0 8px;
        border-radius: 5px;
        border: 1px solid var(--v-border);
        background: transparent;
        color: var(--v-text-muted);
        font-size: 11px;
        font-family: var(--v-mono);
        cursor: pointer;
    }
    .ide-types .ty:hover { color: var(--v-text-2); border-color: var(--v-border-strong); }
    .ide-types .ty.on { background: var(--v-accent-soft); border-color: var(--v-border-strong); color: var(--v-text); }

    .ide-sec {
        display: flex; align-items: center;
        height: 32px;
        margin: 2px 6px;
        padding: 0 8px;
        border-radius: 6px;
        flex: 0 0 auto;
    }
    .ide-sec .cv { width: 14px; height: 14px; color: var(--v-text-muted); flex: 0 0 auto; }
    .ide-sec .nm { margin-left: 6px; font-size: 12px; font-weight: 500; color: var(--v-text-2); }
    .ide-sec .ct { margin-left: 6px; font-size: 11px; color: var(--v-text-muted); font-family: var(--v-mono); }
    .ide-sec .secact { margin-left: auto; display: flex; gap: 4px; color: var(--v-text-2); }
    .ide-sec .secact button {
        display: grid; place-items: center;
        width: 20px; height: 20px;
        border: none; background: transparent; border-radius: 4px;
        color: inherit; cursor: pointer;
    }
    .ide-sec .secact button:hover { background: var(--v-hover); color: var(--v-text); }
    .ide-sec .secact svg { width: 14px; height: 14px; display: block; }
    .ide-sec .secact button.spin svg { animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .ide-tree { flex: 1 1 auto; overflow-y: auto; padding: 2px 0 14px; min-height: 0; }

    .ide-row {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        margin: 0 6px;
        padding: 0 8px;
        font-size: 12.5px;
        color: var(--v-text-2);
        border-radius: 6px;
        cursor: pointer;
        white-space: nowrap;
    }
    .ide-row .ic { width: 14px; height: 14px; flex: 0 0 auto; color: var(--v-text); }
    .ide-row .nm { flex: 0 0 auto; max-width: 60%; overflow: hidden; text-overflow: ellipsis; }
    .ide-row .pt {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--v-text-muted);
        font-size: 11px;
        text-align: right;
        direction: rtl;
    }
    .ide-row .tg { flex: 0 0 auto; font-size: 10px; font-family: var(--v-mono); color: var(--v-text-muted); }
    .ide-row .tg.local { color: var(--v-success); }
    .ide-row .tg.module { color: var(--tk-var); }
    .ide-row .tg.actor { color: var(--v-info); }
    .ide-row .tg.nil { color: var(--v-error); }
    .ide-row .ac { flex: 0 0 auto; width: 6px; height: 6px; border-radius: 999px; background: var(--v-warning); }
    .ide-row:hover { background: var(--v-hover); color: var(--v-text); }
    .ide-row.cursor { background: var(--v-hover); color: var(--v-text); box-shadow: inset 0 0 0 1px var(--v-border-strong); }
    .ide-row.active { background: var(--v-accent-soft); color: var(--v-text); }
    .ide-note { padding: 10px 14px; font-size: 12px; color: var(--v-text-muted); }

    .ide-main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

    .ide-tabs {
        display: flex;
        align-items: stretch;
        height: 40px;
        flex: 0 0 auto;
        background: var(--v-surface);
        border-bottom: 1px solid var(--v-border);
    }
    .tabstrip { display: flex; align-items: stretch; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
    .tabstrip::-webkit-scrollbar { height: 0; }
    .ide-tab {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        max-width: 260px;
        flex: 0 0 auto;
        font-size: 12.5px;
        color: var(--v-text-2);
        border-right: 1px solid var(--v-border);
        position: relative;
        cursor: pointer;
        white-space: nowrap;
    }
    .ide-tab > .lbl { overflow: hidden; text-overflow: ellipsis; }
    .ide-tab svg { width: 16px; height: 16px; flex: 0 0 auto; opacity: 0.6; }
    .ide-tab.t-home svg { color: var(--v-accent); opacity: 1; }
    .ide-tab .fic { color: var(--v-text); opacity: 1; }
    .ide-tab:hover { color: var(--v-text); }
    .ide-tab.active { background: var(--v-contrast); color: var(--v-text); }
    .ide-tab.active::before {
        content: "";
        position: absolute; top: 0; left: 0; right: 0;
        height: 2px;
        background: var(--v-accent);
    }
    .ide-tab .x { width: 15px; height: 15px; color: var(--v-text-muted); opacity: 1; margin-left: 2px; border-radius: 3px; padding: 1px; }
    .ide-tab .x:hover { background: var(--v-hover); color: var(--v-text); }

    .ide-addtab {
        align-self: center;
        display: inline-flex; align-items: center; justify-content: center;
        width: 28px; height: 28px;
        margin-left: 6px;
        flex: 0 0 auto;
        border-radius: 6px;
        border: 1px solid var(--v-border-subtle);
        background: var(--v-raised);
        color: var(--v-text-2);
        cursor: pointer;
    }
    .ide-addtab:hover { color: var(--v-text); background: var(--v-hover); }
    .ide-addtab svg { width: 14px; height: 14px; }

    .ide-run, .ide-layout {
        align-self: center;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        cursor: pointer;
        white-space: nowrap;
        flex: 0 0 auto;
    }
    .ide-run {
        margin-right: 10px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid var(--v-border-strong);
        background: var(--v-raised);
        color: var(--v-text);
        font-size: 12px;
        font-weight: 600;
    }
    .ide-run:hover { background: var(--v-hover); }
    .ide-run svg { width: 15px; height: 15px; }
    .ide-run.spin svg { animation: spin 0.6s linear infinite; }
    .ide-layout {
        margin-right: 10px;
        padding: 0 9px;
        border: 1px solid var(--v-border-subtle);
        background: var(--v-raised);
        border-radius: 6px;
        color: var(--v-text-2);
        font-size: 12px;
        font-weight: 500;
    }
    .ide-layout:hover { color: var(--v-text); background: var(--v-hover); }
    .ide-layout svg { width: 15px; height: 15px; }
    .ide-layout.done { color: var(--v-success); }

    .ide-crumbs {
        display: flex;
        align-items: center;
        gap: 5px;
        height: 32px;
        flex: 0 0 auto;
        padding: 0 12px;
        background: var(--v-contrast);
        font-size: 12.5px;
        color: var(--v-text-2);
        min-width: 0;
    }
    .ide-crumbs .cr { width: 14px; height: 14px; color: var(--v-text-muted); flex: 0 0 auto; }
    .ide-crumbs .fic { width: 14px; height: 14px; color: var(--v-text); flex: 0 0 auto; }
    .ide-crumbs .cur { color: var(--v-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .ide-crumbs .smap { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding-left: 10px; flex: 0 0 auto; }
    .ide-crumbs .smap .lk { width: 13px; height: 13px; color: var(--v-text-2); flex: 0 0 auto; }
    .ide-crumbs .seg {
        display: inline-flex;
        align-items: center;
        height: 24px;
        padding: 0 9px;
        border-radius: 5px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--v-text-2);
        font-size: 12px;
        cursor: pointer;
    }
    .ide-crumbs .seg:hover { color: var(--v-text); background: var(--v-accent-soft); }
    .ide-crumbs .seg.on { border-color: var(--v-border); background: var(--v-raised); color: var(--v-text); }
    .ide-crumbs .sel {
        display: inline-flex; align-items: center; gap: 6px;
        height: 24px; padding: 0 8px;
        border-radius: 5px;
        border: 1px solid var(--v-border);
        background: var(--v-raised);
        color: var(--v-text-2);
        font-size: 11.5px;
        white-space: nowrap;
    }

    .ide-editor {
        flex: 1 1 auto;
        display: flex;
        font-family: var(--v-mono);
        font-size: 12.5px;
        line-height: 1.7;
        background: var(--v-contrast);
        overflow: auto;
        min-height: 0;
        position: relative;
    }

    .ide-gutter {
        flex: 0 0 auto;
        position: sticky;
        left: 0;
        z-index: 2;
        padding: 12px 0 80px;
        background: var(--v-contrast);
        text-align: right;
        color: #636369;
        white-space: pre;
        -webkit-user-select: none;
        user-select: none;
    }
    .ide-gutter span { display: block; padding: 0 12px 0 16px; }

    .ide-code {
        flex: 1 1 auto;
        padding: 12px 24px 80px 4px;
        margin: 0;
        white-space: pre;
        color: var(--v-text);
        font: inherit;
        min-width: 0;
    }

    .tok-kw { color: var(--tk-kw); }
    .tok-cl { color: var(--tk-cl); }
    .tok-var { color: var(--tk-var); }
    .tok-fn { color: var(--tk-fn); }
    .tok-str { color: var(--tk-str); }
    .tok-com { color: var(--tk-com); }
    .tok-num { color: var(--tk-num); }

    .pane {
        flex: 1 1 auto;
        min-width: 0;
        padding: 20px 24px 80px;
        font-family: var(--v-sans);
        font-size: 13px;
        line-height: 1.55;
    }
    .pane.center { display: grid; place-items: center; padding: 24px; }
    .pane > * { max-width: 980px; }

    .muted { color: var(--v-text-muted); font-size: 12.5px; }

    h2 { font-size: 13px; font-weight: 600; letter-spacing: 0.01em; color: var(--v-text); margin: 0; }
    .h2row { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; }
    .h2row + .h2row, .tablewrap + .h2row, .card + .h2row, .muted + .h2row { margin-top: 26px; }

    .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 10px;
        border-radius: 6px;
        border: 1px solid var(--v-border);
        background: var(--v-raised);
        color: var(--v-text-2);
        font-family: var(--v-sans);
        font-size: 11.5px;
        font-weight: 500;
        cursor: pointer;
        line-height: 1;
        white-space: nowrap;
    }
    .btn:hover { background: var(--v-hover); color: var(--v-text); }
    .btn.primary { background: var(--v-accent-hover); border-color: var(--v-accent-hover); color: #141416; font-weight: 600; }
    .btn.primary:hover { background: #fff; color: #141416; }
    .btn.danger:hover { color: var(--v-error); border-color: rgba(239, 68, 68, 0.45); }
    .btn.done { color: var(--v-success); border-color: rgba(16, 185, 129, 0.45); }
    .btn svg { width: 12px; height: 12px; flex: 0 0 auto; }
    .push { margin-left: auto; }

    .tablewrap { border: 1px solid var(--v-border); border-radius: 8px; overflow: hidden; background: var(--v-surface); }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    thead th {
        text-align: left;
        padding: 9px 13px;
        background: var(--v-bg);
        color: var(--v-text-2);
        font-weight: 500;
        font-size: 11.5px;
        border-bottom: 1px solid var(--v-border);
    }
    thead th + th { border-left: 1px solid var(--v-border); }
    tbody td {
        padding: 9px 13px;
        border-bottom: 1px solid var(--v-border-subtle);
        color: var(--v-text-2);
        font-family: var(--v-mono);
        font-size: 11.5px;
        vertical-align: top;
    }
    tbody td + td { border-left: 1px solid var(--v-border-subtle); }
    tbody tr:last-child td { border-bottom: none; }
    tbody td.name { color: var(--v-text); }
    tbody tr.clickable { cursor: pointer; }
    tbody tr.clickable:hover td { background: var(--v-hover); color: var(--v-text); }
    td pre { margin: 0; font-family: var(--v-mono); font-size: 11.5px; line-height: 1.6; max-height: 320px; overflow: auto; white-space: pre; }
    td .btn { margin-top: 6px; }

    .chip {
        display: inline-flex;
        align-items: center;
        height: 20px;
        padding: 0 7px;
        border-radius: 4px;
        border: 1px solid var(--v-border);
        background: var(--v-raised);
        font-family: var(--v-mono);
        font-size: 10.5px;
        color: var(--v-text-2);
    }
    .chip.ac { color: var(--v-warning); border-color: rgba(234, 179, 8, 0.35); }

    .card {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        padding: 13px 15px;
        border: 1px solid var(--v-border);
        border-radius: 8px;
        margin-bottom: 8px;
        background: var(--v-surface);
    }
    .card .body { flex: 1 1 auto; min-width: 0; }
    .card .title { font-size: 12.5px; font-weight: 600; color: var(--v-text); margin-bottom: 3px; }
    .card .desc { font-size: 12px; color: var(--v-text-muted); line-height: 1.55; }
    .card code, .icode {
        font-family: var(--v-mono);
        font-size: 11px;
        color: var(--v-text);
        background: var(--v-raised);
        border: 1px solid var(--v-border);
        border-radius: 4px;
        padding: 1px 5px;
    }

    .toggle {
        flex: 0 0 auto;
        width: 38px; height: 22px;
        border-radius: 999px;
        border: 1px solid var(--v-border-strong);
        background: var(--v-raised);
        position: relative;
        cursor: pointer;
        transition: background 0.14s, border-color 0.14s;
    }
    .toggle::after {
        content: "";
        position: absolute;
        top: 3px; left: 3px;
        width: 14px; height: 14px;
        border-radius: 50%;
        background: var(--v-text-muted);
        transition: transform 0.14s, background 0.14s;
    }
    .toggle.on { background: var(--v-accent-soft); border-color: var(--v-accent); }
    .toggle.on::after { transform: translateX(16px); background: var(--v-accent-hover); }

    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .row input {
        flex: 1 1 auto;
        height: 30px;
        background: var(--v-raised);
        border: 1px solid var(--v-border);
        border-radius: 6px;
        padding: 0 10px;
        color: var(--v-text);

    .term-head .src.on { background: var(--v-contrast); border-color: var(--v-border); color: var(--v-text); }
    .term-head .filter {

    }
    .term-head .filter svg { position: absolute; left: 8px; width: 13px; height: 13px; color: var(--v-text-muted); pointer-events: none; }
    .term-head .filter input {
        width: 170px; height: 24px;
        border-radius: 5px;
        border: 1px solid var(--v-border);
        background: var(--v-raised);
        padding: 0 8px 0 26px;
        color: var(--v-text);

    }
    .term-head .filter input::placeholder { color: var(--v-text-muted); }
    .term-head .tact { display: flex; gap: 2px; }
    .term-head .tact button {
        display: grid; place-items: center;
        width: 24px; height: 24px;
        border: none; background: transparent; border-radius: 5px;
        color: var(--v-text-2); cursor: pointer;
    }
    .term-head .tact button:hover { background: var(--v-hover); color: var(--v-text); }
    .term-head .tact button.on { color: var(--v-text); background: var(--v-hover); }

    .term-body {

<body>

<div class="toast" id="toast"></div>

<script>
(function () {
    const SECTIONS = [
        { id: "scripts", label: "Scripts", icon: '<path d="M14.5 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6.5z"/><path d="M14 2v5h5"/><path d="m9.5 12.5-1.5 2 1.5 2"/><path d="m14.5 12.5 1.5 2-1.5 2"/>' },
        { id: "anticheat", label: "Anti-Cheat", icon: '<path d="M12 22s8-4 8-10V5.2l-8-3.2-8 3.2V12c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>' },
        { id: "actors", label: "Actors", icon: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="3.5"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>' },
        { id: "unknown", label: "Unknown", icon: '<circle cx="12" cy="12" r="9.5"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.3 2.4c-.6.2-.9.8-.9 1.4v.4"/><path d="M12 17h.01"/>' },
        { id: "settings", label: "Settings", icon: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>' },
    ];
    const TABS = ["Source", "Functions", "Info"];
    const TYPES = [
        { id: "local", label: "LocalScript" },
        { id: "module", label: "ModuleScript" },
        { id: "actor", label: "Actor" },
        { id: "nil", label: "nil" },
        { id: "other", label: "other" },
    ];

    const ICON_FILE = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'
        + '<path d="M14.5 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6.5z"/><path d="M14 2v5h5"/></svg>';
    const ICON_HOME = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
        + '<path d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75"/></svg>';
    const ICON_X = '<svg class="x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
    const ICON_CHEV = '<svg class="cr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';
    const ICON_RELOAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v6h-6"/></svg>';
    const ICON_DOWN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M4 21h16"/></svg>';
    const ICON_PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
    const ICON_LINK = '<svg class="lk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
        + '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>';
    const COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
        + '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';

    const KEYWORDS = new Set(["and","break","do","else","elseif","end","for","function","if","in",
        "local","not","or","repeat","return","then","until","while","continue","export","type"]);
    const CONSTS = new Set(["true","false","nil","self"]);

    const el = (id) => document.getElementById(id);
    const dot = el("dot"), statusEl = el("status"), listEl = el("list"), editorEl = el("editor");

    let socket = null, nextId = 1;
    const waiting = new Map();

    let section = "scripts";
    let entries = [];
    let visibleEntries = [];
    let cursor = -1;
    let counts = {};
    let activeTypes = new Set(TYPES.map((t) => t.id));

    let openTabs = [];
    let selected = null;
    const tabState = {};

    let caret = null;
    let demo = false;

    let session = 0;
    let toolPresent = false;
    let userClosed = false;
    let reconnectTimer = null;
    let probeTimer = null;

    function esc(s) {
        return String(s === undefined || s === null ? "" : s)
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function sectionLabel(id) {
        const s = SECTIONS.filter((x) => x.id === id)[0];
        return s ? s.label : id;
    }

    function ready() { return demo || toolPresent; }

    let toastTimer = null;
    function toast(text, isErr) {
        const t = el("toast");
        t.textContent = text;
        t.className = "toast show" + (isErr ? " err" : "");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { t.className = "toast" + (isErr ? " err" : ""); }, 2600);
    }

    const LOG_LIMIT = 600;
    const logs = [];
    let logSrc = "all";
    let logFollow = true;

    function clock() {
        const d = new Date();
        const p = (n) => (n < 10 ? "0" + n : "" + n);
        return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
    }

    function log(src, text, cls) {
        logs.push({ t: clock(), src: src, text: text, cls: cls || "" });
        if (logs.length > LOG_LIMIT) logs.splice(0, logs.length - LOG_LIMIT);
        renderLogs();
    }

    function renderLogs() {
        const body = el("termbody");
        const q = el("termfilter").value.trim().toLowerCase();
        const rows = logs.filter((l) => (logSrc === "all" || l.src === logSrc)
            && (!q || (l.src + " " + l.text).toLowerCase().indexOf(q) !== -1));
        if (!rows.length) {
            body.innerHTML = '<div class="term-empty">' + (logs.length ? "nothing matches the filter" : "no output yet") + "</div>";
            return;
        }
        body.innerHTML = rows.map((l) => '<div class="term-line ' + l.cls + '">'
            + '<span class="ts">[' + l.t + "]</span> "
            + '<span class="tag">[' + esc(l.src) + "]</span> " + esc(l.text) + "</div>").join("");
        if (logFollow) body.scrollTop = body.scrollHeight;
    }

    function highlight(src) {
        let out = "", i = 0;
        const n = src.length;

        const isName = (c) => /[A-Za-z0-9_]/.test(c);
        const push = (cls, text) => { out += cls ? '<span class="' + cls + '">' + esc(text) + "</span>" : esc(text); };

        while (i < n) {
            const c = src[i];

            if (c === "-" && src[i + 1] === "-") {
                let j = i + 2;
                if (src[j] === "[" && src[j + 1] === "[") {
                    const close = src.indexOf("]]", j);
                    j = close === -1 ? n : close + 2;
                } else {
                    while (j < n && src[j] !== "\n") j++;
                }
                push("tok-com", src.slice(i, j)); i = j; continue;
            }

            if (c === "[" && (src[i + 1] === "[" || src[i + 1] === "=")) {
                const m = /^\[(=*)\[/.exec(src.slice(i));
                if (m) {
                    const close = "]" + m[1] + "]";
                    const at = src.indexOf(close, i + m[0].length);
                    const j = at === -1 ? n : at + close.length;
                    push("tok-str", src.slice(i, j)); i = j; continue;
                }
            }

            if (c === '"' || c === "'") {
                let j = i + 1;
                while (j < n) {
                    if (src[j] === "\\") { j += 2; continue; }
                    if (src[j] === c || src[j] === "\n") { j++; break; }
                    j++;
                }
                push("tok-str", src.slice(i, j)); i = j; continue;
            }

            if (/[0-9]/.test(c) || (c === "." && /[0-9]/.test(src[i + 1] || ""))) {
                let j = i;
                while (j < n && /[0-9a-fA-FxX.eE_+-]/.test(src[j])) {
                    if ((src[j] === "+" || src[j] === "-") && !/[eE]/.test(src[j - 1])) break;
                    j++;
                }
                push("tok-num", src.slice(i, j)); i = j; continue;
            }

            if (isName(c) && !/[0-9]/.test(c)) {
                let j = i;
                while (j < n && isName(src[j])) j++;
                const word = src.slice(i, j);
                let k = j;
                while (k < n && /\s/.test(src[k])) k++;
                if (KEYWORDS.has(word)) push("tok-kw", word);
                else if (CONSTS.has(word)) push("tok-cl", word);
                else if (src[k] === "(" || src[k] === "{" || src[k] === '"' || src[k] === "'") push("tok-fn", word);
                else push("tok-var", word);
                i = j; continue;
            }

            push(null, c); i++;
        }
        return out;
    }

    function setStatus(text, state) {
        statusEl.textContent = text;
        statusEl.title = text;
        dot.className = "dt" + (state ? " " + state : "");
    }

    const SLOW_ACTIONS = { saveall: 900000, downloadbridge: 120000, sandbox: 120000 };

    function send(payload) {
        if (!socket || socket.readyState !== WebSocket.OPEN) return Promise.reject(new Error("not connected"));
        return new Promise((resolve, reject) => {
            const id = nextId++;
            waiting.set(id, { resolve, reject });
            socket.send(JSON.stringify(Object.assign({ type: "request", id }, payload)));
            const limit = SLOW_ACTIONS[payload.action] || 25000;
            setTimeout(() => {
                if (waiting.has(id)) { waiting.delete(id); reject(new Error("timed out")); }
            }, limit);
        });
    }

    function api(payload) {
        const started = Date.now();
        const label = payload.action + (payload.key ? " " + payload.key : "");
        const p = demo ? demoApi(payload) : send(payload);
        return p.then((data) => {
            log("exec", label + " → ok (" + (Date.now() - started) + "ms)", "ok");
            return data;
        }, (err) => {
            log("exec", label + " → " + err.message, "err");
            throw err;
        });
    }

    function rejectPending(reason) {
        waiting.forEach((p) => { try { p.reject(new Error(reason)); } catch (e) {} });
        waiting.clear();
    }

    function resetState() {
        entries = [];
        visibleEntries = [];
        cursor = -1;
        openTabs = [];

    function connect() {
        clearTimeout(reconnectTimer);
        userClosed = false;
        const url = el("url").value.trim();
        if (!url) return;

        if (socket) { try { socket.onclose = null; socket.close(); } catch (e) {} socket = null; }

        try { socket = new WebSocket(url); } catch (err) { setStatus(String(err), "err"); return; }
        setStatus("connecting", "wait");
        toolPresent = false;
        log("relay", "connecting to " + url);
        updateConnectBtn();

        socket.onopen = () => {
            setStatus("waiting for executor…", "wait");
            log("relay", "socket open — waiting for executor", "ok");
            updateConnectBtn();
            socket.send(JSON.stringify({ type: "hello", role: "web" }));
            clearTimeout(probeTimer);
            probeTimer = setTimeout(() => {
                if (toolPresent) return;
                api({ action: "info" }).then((info) => { if (!toolPresent) onToolReady(info); }).catch(() => {});
            }, 700);
        };

        socket.onclose = () => {
            toolPresent = false;
            rejectPending("connection closed");
            updateConnectBtn();
            if (userClosed) {
                setStatus("disconnected", null);
                log("relay", "disconnected by user");
                return;
            }
            setStatus("reconnecting…", "wait");
            log("relay", "socket closed — reconnecting in 2s", "warn");
            if (!demo) listEl.innerHTML = '<div class="ide-note">relay offline — reconnecting…</div>';
            reconnectTimer = setTimeout(connect, 2000);
        };

        socket.onerror = () => { setStatus("connection error", "err"); log("relay", "socket error", "err"); updateConnectBtn(); };

        socket.onmessage = (event) => {
            let msg;
            try { msg = JSON.parse(event.data); } catch (err) { return; }

            if (msg.type === "hello" && msg.info) {
                onToolReady(msg.info);
                return;
            }
            if (msg.type === "peer" && msg.role === "tool" && msg.event === "disconnect") {
                setStatus("waiting for executor…", "wait");
                log("relay", "executor detached", "warn");
                onToolLost();
                return;
            }
            if (msg.type === "response") {
                const pending = waiting.get(msg.id);
                if (!pending) return;
                waiting.delete(msg.id);
                if (msg.ok) pending.resolve(msg.data); else pending.reject(new Error(msg.error || "failed"));
            }
        };
    }

    function disconnect() {
        userClosed = true;
        clearTimeout(reconnectTimer);
        clearTimeout(probeTimer);
        if (socket) { try { socket.close(); } catch (e) {} }
        socket = null;

        if (!demo) {

    }

    function renderStatusBar() {
        const left = [];
        if (selected) {
            const [, label] = labelOf(selected);
            const code = currentSource();
            left.push(caret ? "Ln " + caret.ln + ", Col " + caret.col : "Ln 1, Col 1");
            left.push("Spaces: 4");
            left.push(label);
            if (code !== null) left.push(humanBytes(code.length) + " · " + countLines(code) + " lines");
            left.push(selected.key);
        } else {
            left.push(ready() ? "ready" : "no executor");
        }
        el("statleft").innerHTML = left.map((s) => '<span class="k">' + esc(s) + "</span>").join(" &nbsp;·&nbsp; ");

        const counted = [];
        SECTIONS.forEach((s) => {
            if (typeof counts[s.id] === "number") counted.push(s.label.toLowerCase() + " " + counts[s.id]);
        });
        const state = demo ? '<span class="conn demoflag"><span class="dt demo"></span>Demo data</span>'
            : toolPresent ? '<span class="conn"><span class="dt on"></span>Connected</span>'
            : '<span class="conn"><span class="dt"></span>Offline</span>';
        el("statright").innerHTML = (counted.length ? esc(counted.join("   ")) + " &nbsp;&nbsp; " : "")
            + "UTF-8 &nbsp;&nbsp; Luau &nbsp;&nbsp; " + state;
    }

    function renderDoc(body) {
        copyBuffers = {};

        setPane(body || (selected ? paneMsg("loading…") : emptyPaneHtml()));

    function emptyPaneHtml() {
        if (ready()) {
            return '<div class="pane center"><div class="welcome"><h3>No file open</h3>'

                + '<div class="keys"><span><b>/</b> search</span><span><b>↑ ↓</b> move</span>'
                + "<span><b>Enter</b> open</span><span><b>R</b> reload</span><span><b>Esc</b> close tab</span></div></div></div>";

                + "<ol><li>Join the Roblox game.</li>"
                + "<li>Run the GcView script in your executor.</li>"
                + "<li>Scripts appear here automatically — no page refresh needed.</li></ol>"

    let copyBuffers = {};
    let copySeq = 0;

    function copyButton(text, label, cls) {
        const id = "c" + ++copySeq;
        copyBuffers[id] = text;
        return '<button class="btn' + (cls ? " " + cls : "") + '" data-copy="' + id + '">'
            + COPY_ICON + (label ? " " + esc(label) : "") + "</button>";
    }

    function writeClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            return navigator.clipboard.writeText(text);
        }
        return new Promise((resolve, reject) => {
            const area = document.createElement("textarea");
            area.value = text;
            area.style.position = "fixed";
            area.style.opacity = "0";
            document.body.appendChild(area);
            area.select();
            let ok = false;
            try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
            document.body.removeChild(area);
            ok ? resolve() : reject(new Error("copy blocked"));
        });
    }

    function wireCopy(root) {
        Array.prototype.forEach.call((root || document).querySelectorAll("[data-copy]"), (btn) => {
            btn.onclick = (e) => {
                e.stopPropagation();
                const text = copyBuffers[btn.getAttribute("data-copy")] || "";
                const original = btn.innerHTML;
                writeClipboard(text).then(() => {
                    btn.classList.add("done");
                    btn.innerHTML = COPY_ICON + " Copied";
                    setTimeout(() => { btn.classList.remove("done"); btn.innerHTML = original; }, 1300);
                }).catch(() => {
                    btn.innerHTML = COPY_ICON + " Failed";
                    setTimeout(() => { btn.innerHTML = original; }, 1300);
                });
            };
        });
    }

    function setPane(html) {
        editorEl.innerHTML = html;
        editorEl.scrollTop = 0;
        wireCopy(editorEl);

        const wc = el("wconnect");
        if (wc) wc.onclick = () => connect();
        const wd = el("wdemo");
        if (wd) wd.onclick = () => setDemo(true);
    }

    function paneMsg(text) {
        return '<div class="pane"><span class="muted">' + esc(text) + "</span></div>";
    }

    function countLines(text) {
        let n = 1;
        for (let i = 0; i < text.length; i++) if (text.charCodeAt(i) === 10) n++;
        return n;
    }

    function editorHtml(code) {
        const lines = countLines(code);
        let nums = "";
        for (let i = 1; i <= lines; i++) nums += "<span>" + i + "</span>";
        return '<div class="ide-gutter">' + nums + '</div><pre class="ide-code">' + highlight(code) + "</pre>";
    }

    function updateCaret() {
        const code = editorEl.querySelector(".ide-code");
        if (!code) return;
        const src = currentSource();
        if (src === null || src.length > 400000) return;
        const sel = window.getSelection();
        if (!sel || !sel.rangeCount) return;
        const r = sel.getRangeAt(0);
        if (!code.contains(r.startContainer)) return;
        const pre = document.createRange();
        pre.selectNodeContents(code);
        pre.setEnd(r.startContainer, r.startOffset);
        const text = pre.toString();
        const nl = text.lastIndexOf("\n");
        caret = { ln: countLines(text), col: text.length - nl };
        renderStatusBar();
    }

    function safeFileName(name, ext) {
        return String(name || "script").replace(/[\\/:*?"<>|\r\n]+/g, "_").slice(0, 90) + ext;
    }

    function downloadBlob(name, blob) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

    function humanBytes(n) {
        if (n < 1024) return n + " B";
        if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
        return (n / 1048576).toFixed(2) + " MB";
    }

    function fetchChunked(action, key, field, onProgress) {
        const mySession = session;
        let out = "";
        let offset = 1;

        function step() {
            if (mySession !== session) return Promise.reject(new Error("session reset"));
            return api({ action: action, key: key, offset: offset, limit: 262144 }).then((data) => {
                const piece = data[field] || "";
                out += piece;

                if (typeof data.total !== "number") return out;

                if (onProgress) onProgress(out.length, data.total);
                offset = data.nextOffset || offset + piece.length;
                if (data.done || piece.length === 0 || out.length >= data.total) return out;
                return step();
            });
        }
        return step();
    }

    function typeOf(entry) {
        if (!entry.parented) return "nil";
        const ctx = (entry.context || "").toLowerCase();
        if (ctx.indexOf("local") === 0) return "local";
        if (ctx.indexOf("module") === 0) return "module";
        if (ctx.indexOf("actor") === 0) return "actor";
        return "other";
    }

    function labelOf(entry) {
        const t = typeOf(entry);
        if (t === "nil") return ["nil", "nil"];
        if (t === "local") return ["local", "LocalScript"];
        if (t === "module") return ["module", "ModuleScript"];
        if (t === "actor") return ["actor", "Actor"];
        return ["", entry.context || "Unknown"];
    }

    function shortType(entry) {
        const t = typeOf(entry);
        if (t === "local") return "ls";
        if (t === "module") return "ms";
        if (t === "actor") return "act";
        if (t === "nil") return "nil";
        return "?";
    }

    function parentPath(entry) {
        const p = entry.path || "";
        const name = entry.name || "";
        if (name && p.slice(-name.length) === name) return p.slice(0, Math.max(0, p.length - name.length - 1));
        return p;
    }

    function applyCursor() {
        Array.prototype.forEach.call(listEl.querySelectorAll(".ide-row"), (row) => {
            const idx = Number(row.getAttribute("data-idx"));
            row.classList.toggle("cursor", idx === cursor);
        });
    }

    function moveCursor(delta) {
        if (!visibleEntries.length) return;
        cursor = cursor < 0 ? (delta > 0 ? 0 : visibleEntries.length - 1)
                            : Math.max(0, Math.min(visibleEntries.length - 1, cursor + delta));
        applyCursor();
        const row = listEl.querySelector('.ide-row[data-idx="' + cursor + '"]');
        if (row) row.scrollIntoView({ block: "nearest" });
    }

    function openCursor() {
        if (cursor < 0 || cursor >= visibleEntries.length) return;
        openEntry(visibleEntries[cursor]);
    }

    function openEntry(entry) {
        if (!entry || section === "unknown") return;
        if (openTabs.indexOf(entry) === -1) openTabs.push(entry);
        selected = entry;
        caret = null;
        log("ui", "open " + entry.path);
        renderList(); renderDoc(); loadTab();
    }

    function renderList() {
        const q = el("filter").value.trim().toLowerCase();
        listEl.innerHTML = "";

        if (section === "unknown") {
            const rows = entries.filter((f) => !q || (f.name + " " + f.source).toLowerCase().indexOf(q) !== -1);
            visibleEntries = rows;
            if (!rows.length) { listEl.innerHTML = '<div class="ide-note">no orphan functions</div>'; return; }
            rows.forEach((fn, idx) => {
                const row = document.createElement("div");
                row.className = "ide-row" + (idx === cursor ? " cursor" : "");
                row.setAttribute("data-idx", idx);
                row.title = fn.name + " · line " + fn.line;
                row.innerHTML = ICON_FILE + '<span class="nm">' + esc(fn.name) + "</span>"
                    + '<span class="pt">line ' + fn.line + " · " + fn.numparams + "p</span>";
                row.onclick = () => { cursor = idx; applyCursor(); };
                listEl.appendChild(row);
            });
            return;
        }

        const rows = entries.filter((e) => activeTypes.has(typeOf(e))
            && (!q || (e.path + " " + e.name).toLowerCase().indexOf(q) !== -1));
        visibleEntries = rows;

        if (!rows.length) { listEl.innerHTML = '<div class="ide-note">nothing matches</div>'; return; }

        rows.forEach((entry, idx) => {
            const row = document.createElement("div");
            row.className = "ide-row" + (selected && selected.key === entry.key ? " active" : "")
                + (idx === cursor ? " cursor" : "");
            row.setAttribute("data-idx", idx);
            row.title = entry.path;
            row.innerHTML = ICON_FILE
                + '<span class="nm">' + esc(entry.name || entry.path) + "</span>"
                + '<span class="pt">' + esc(parentPath(entry)) + "</span>"
                + (entry.isAntiCheat ? '<span class="ac" title="anti-cheat"></span>' : "")
                + '<span class="tg ' + typeOf(entry) + '">' + shortType(entry) + "</span>";
            row.onclick = () => { cursor = idx; openEntry(entry); };
            listEl.appendChild(row);
        });
    }

    function renderSettings() {

        selected = null;
        renderTabs();
        renderCrumbs();
        renderStatusBar();
        setPane(paneMsg("loading…"));

        api({ action: "config" }).then((data) => {

            setPane(html);

    function loadList() {
        if (section === "settings") {
            listEl.innerHTML = '<div class="ide-note">no list for settings</div>';
            el("types").innerHTML = "";
            el("groupcount").textContent = "";
            renderSettings();
            return;
        }
        renderTypes();
        if (!ready() && !(socket && socket.readyState === WebSocket.OPEN)) {
            listEl.innerHTML = '<div class="ide-note">not connected</div>';
            return;
        }
        const mySession = session;
        listEl.innerHTML = '<div class="ide-note">loading…</div>';
        api({ action: section }).then((data) => {
            if (mySession !== session) return;
            entries = section === "unknown" ? (data.functions || []) : (data.entries || []);
            cursor = -1;
            renderList();
        }).catch((err) => {
            if (mySession !== session) return;
            listEl.innerHTML = '<div class="ide-note">' + esc(err.message) + "</div>";
        });
    }

    function refreshList() {
        if (!ready()) { toast("no executor connected", true); return; }
        const btn = el("reload");
        if (btn) { btn.classList.add("spin"); setTimeout(() => btn.classList.remove("spin"), 600); }
        const side = el("refresh");
        if (side) { side.classList.add("spin"); setTimeout(() => side.classList.remove("spin"), 600); }
        const mySession = session;
        api({ action: "info" }).then((info) => {
            if (mySession !== session) return;
            counts = info.counts || {};
            renderSections();
        }).catch(() => {});
        loadList();
    }

    function valueTable(title, rows) {
        if (!rows || !rows.length) {
            return '<div class="h2row"><h2>' + title + '</h2></div><div class="muted">none</div>';
        }
        const raw = rows.map((r) => "[" + r.index + "] = " + r.value).join("\n");
        let html = '<div class="h2row"><h2>' + title + " (" + rows.length + ")</h2>"
            + '<span class="push">' + copyButton(raw, "Copy") + "</span></div>"
            + '<div class="tablewrap"><table><thead><tr><th style="width:64px">#</th><th>value</th></tr></thead><tbody>';
        rows.forEach((r) => {
            const cell = r.code
                ? "<pre>" + highlight(r.value) + "</pre>" + copyButton(r.value, "Copy")
                : '<span class="name">' + highlight(r.value) + "</span>";
            html += "<tr><td>" + r.index + "</td><td>" + cell + "</td></tr>";
        });
        return html + "</tbody></table></div>";
    }

    function showFunctionDetail(index) {
        const mySession = session;
        setPane(paneMsg("loading…"));
        api({ action: "funcdetail", key: selected.key, index: index }).then((data) => {
            if (mySession !== session) return;
            const i = data.info;
            let html = '<div class="pane"><span class="back" id="back">&larr; back to functions</span>'
                + '<div class="h2row"><span class="chip">' + esc(i.name) + "</span>"
                + '<span class="chip">line ' + i.line + "</span>"
                + '<span class="chip">params ' + i.numparams + "</span>"
                + '<span class="chip">vargs ' + (i.vargs ? "yes" : "no") + "</span>"
                + (i.hash ? '<span class="chip">' + esc(i.hash.slice(0, 18)) + "</span>" : "") + "</div>"
                + valueTable("Constants", data.constants)
                + valueTable("Upvalues", data.upvalues) + "</div>";
            setPane(html);
            const back = el("back");
            if (back) back.onclick = () => loadTab();
        }).catch((err) => {
            if (mySession !== session) return;
            const hint = err.message === "unknown action"
                ? "this build of the tool has no funcdetail action &mdash; re-run bundled.luau in the executor"
                : esc(err.message);
            setPane('<div class="pane"><span class="back" id="back">&larr; back to functions</span>'
                + '<div class="muted">' + hint + "</div></div>");
            const back = el("back");
            if (back) back.onclick = () => loadTab();
        });
    }

    function loadTab() {
        if (!selected) return;
        const mySession = session;
        const view = viewOf(selected);
        const tab = view.tab;

        if (tab === "Info") {
            const rows = [["path", selected.path], ["name", selected.name], ["context", selected.context],
                ["class", selected.class || "-"], ["parented", String(selected.parented)], ["key", selected.key]];
            const raw = rows.map((r) => r[0] + ": " + r[1]).join("\n");
            let html = '<div class="pane"><div class="h2row"><h2>Details</h2><span class="push">' + copyButton(raw, "Copy") + "</span></div>"
                + '<div class="tablewrap"><table><thead><tr><th style="width:160px">field</th><th>value</th></tr></thead><tbody>';
            rows.forEach((r) => { html += "<tr><td>" + esc(r[0]) + '</td><td class="name">' + esc(r[1]) + "</td></tr>"; });
            html += "</tbody></table></div>";
            if (selected.reasons && selected.reasons.length) {
                html += '<div class="reasons">' + selected.reasons.map(esc).join("<br>") + "</div>";
            }
            html += '<div class="h2row"><h2>Bytecode</h2><span class="push">'
                + '<button class="btn" id="dlbc">' + ICON_DOWN + " Download .luac</button></span></div>"
                + '<div class="muted" id="bcnote">not fetched</div></div>';
            setPane(html);

            const key = selected.key;
            const name = selected.path;
            const bc = el("dlbc");
            if (bc) {
                bc.onclick = () => {
                    const note = el("bcnote");
                    if (note) note.textContent = "fetching…";
                    fetchChunked("bytecode", key, "base64", (got, total) => {
                        if (note) note.textContent = "fetching " + humanBytes(got) + " / " + humanBytes(total);
                    }).then((b64) => {
                        const bin = atob(b64);
                        const bytes = new Uint8Array(bin.length);
                        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                        downloadBlob(safeFileName(name, ".luac"), new Blob([bytes], { type: "application/octet-stream" }));
                        if (note) note.textContent = humanBytes(bytes.length) + " downloaded";
                    }).catch((err) => { if (note) note.textContent = err.message; });
                };
            }
            return;
        }

        if (tab === "Source") {
            const key = selected.key;
            if (view.source !== null) { setPane(editorHtml(view.source)); renderTabs(); renderStatusBar(); return; }
            setPane(paneMsg("loading…"));
            fetchChunked("source", key, "source", (got, total) => {
                if (mySession !== session) return;
                setPane(paneMsg("loading " + humanBytes(got) + " / " + humanBytes(total)));
            }).then((code) => {
                if (mySession !== session || !selected || selected.key !== key) return;
                view.source = code;
                setPane(editorHtml(code));
                renderTabs();
                renderStatusBar();
            }).catch((err) => { if (mySession === session) setPane(paneMsg(err.message)); });
            return;
        }

        setPane(paneMsg("loading…"));
        api({ action: "functions", key: selected.key }).then((data) => {
            if (mySession !== session) return;
            const fns = data.functions || [];
            if (!fns.length) { setPane(paneMsg("no functions resolved")); return; }
            const raw = fns.map((f) => f.name + " | line " + f.line + " | params " + f.numparams
                + " | vargs " + (f.vargs ? "yes" : "no") + (f.hash ? " | " + f.hash : "")).join("\n");
            let html = '<div class="pane"><div class="h2row"><h2>' + fns.length + " function(s)</h2>"
                + '<span class="push">' + copyButton(raw, "Copy") + "</span></div>"
                + '<div class="tablewrap"><table><thead><tr><th>name</th><th style="width:80px">line</th><th style="width:80px">params</th>'
                + '<th style="width:80px">vargs</th><th style="width:170px">hash</th></tr></thead><tbody>';
            fns.forEach((f) => {
                html += '<tr class="clickable" data-index="' + f.index + '"><td class="name">' + esc(f.name)
                    + "</td><td>" + f.line + "</td><td>" + f.numparams + "</td><td>" + (f.vargs ? "yes" : "no")
                    + "</td><td>" + esc((f.hash || "").slice(0, 18)) + "</td></tr>";
            });
            setPane(html + "</tbody></table></div></div>");
            Array.prototype.forEach.call(editorEl.querySelectorAll("tr.clickable"), (tr) => {
                tr.onclick = () => showFunctionDetail(Number(tr.getAttribute("data-index")));
            });
        }).catch((err) => { if (mySession === session) setPane(paneMsg(err.message)); });
    }

    el("connect").onclick = () => {
        const live = socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING);
        if (live) disconnect(); else connect();
    };
    el("demobtn").onclick = () => setDemo(!demo);
    el("filter").oninput = () => { cursor = -1; renderList(); };
    el("url").onkeydown = (e) => { if (e.key === "Enter") connect(); };
    el("refresh").onclick = refreshList;

    el("termtoggle").onclick = () => el("term").classList.toggle("collapsed");
    el("termfilter").oninput = renderLogs;
    el("termclear").onclick = () => { logs.length = 0; renderLogs(); };
    el("termwrap").onclick = () => {
        logFollow = !logFollow;
        el("termwrap").classList.toggle("on", logFollow);
        if (logFollow) renderLogs();
    };
    Array.prototype.forEach.call(document.querySelectorAll(".term-head .src"), (b) => {
        b.onclick = () => {
            logSrc = b.getAttribute("data-src");
            Array.prototype.forEach.call(document.querySelectorAll(".term-head .src"), (o) => {
                o.classList.toggle("on", o === b);
            });
            renderLogs();
        };
    });

    editorEl.addEventListener("click", updateCaret);
    editorEl.addEventListener("keyup", updateCaret);

    const isTyping = (t) => t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA");

    document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
            e.preventDefault(); const f = el("filter"); f.focus(); f.select(); return;
        }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "w" && selected) {
            e.preventDefault(); closeTab(selected); return;
        }

        const filterFocused = document.activeElement === el("filter");

        if (!isTyping(e.target) || filterFocused) {
            if (e.key === "ArrowDown") { e.preventDefault(); moveCursor(1); return; }
            if (e.key === "ArrowUp") { e.preventDefault(); moveCursor(-1); return; }
            if (e.key === "Enter" && cursor >= 0) { e.preventDefault(); openCursor(); return; }
        }

        if (isTyping(e.target)) {
            if (e.key === "Escape") e.target.blur();
            return;
        }

        if (e.key === "Escape") {
            if (selected) closeTab(selected);
            return;
        }
        if (e.key === "/") { e.preventDefault(); el("filter").focus(); return; }
        if (e.key === "`") { e.preventDefault(); el("term").classList.toggle("collapsed"); return; }
        if (e.key.toLowerCase() === "r") { refreshList(); return; }
    });

    el("termwrap").classList.add("on");
    log("ui", "GcView ready");
    renderLogs();
    renderSections();
    renderTypes();
    renderDoc();
    updateDemoBtn();
    updateConnectBtn();

    connect();
})();
</script>
</body>
</html>
